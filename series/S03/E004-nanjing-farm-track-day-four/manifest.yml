        (-1.9 dB) three milliseconds later.
        PLACED WITH NO LAG (operator instruction, 2026-09-01): the downbeat lands on the
        master's very first sample, ahead of the first word, so the bed is seeked 0.383s into
        the file rather than delayed. Nothing musical is skipped to get there — everything
        before 0.377s in the track is silence. This is a deliberate departure from the rule
        used everywhere else in S03, where the bed enters on the second script sentence and
        the hook plays dry; the zh-CN sibling still does it the old way in the same episode.
        The track fades from ~225s and is gone by 240s. Irrelevant at 52s, but it means this
        bed can carry a much longer cut without a hard out.
