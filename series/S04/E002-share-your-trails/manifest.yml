# Episode manifest — source of truth for this episode.
# Schema notes and naming: agents.d/modules/naming-conventions.md
# Validate with: tools/vm check

# Was an interstitial with a one-decimal id (see brief.md for how it was produced).
# The decimal form is retired: it said WHERE a piece published and never said what it
# was, so these moved into seasons of their own and `lineage:` below carries both
# facts separately. It still does not advance the 100-track counter.
video_id: "S04E002"
slug: "share-your-trails"
# The VO is recorded and cut and the script + beats below are transcribed off it, but the
# packaging pass (cover) hasn't run and the stage gates are ordered, so this stays at topic
# rather than claiming scripting. Moving it up needs a cover, not more audio.
status: topic

lineage:
  follows: S03E003
  reason: >-
    introduces the trails functionality; a feature piece, not an answer to S03E003

formats:
  primary: short_vertical
  aspect: 9x16
  resolution: 1080x1920
  fps: 30

variants:
  en-US:
    script: script.en-US.md
    cover: null
    subtitles: subtitles/en-US.srt
    remotion_props: null
    voiceover_asset_id: VO_EN_025
    platforms: [tiktok, ytshorts, reels]
  zh-CN:
    script: script.zh-CN.md
    cover: null
    subtitles: subtitles/zh-CN.srt
    remotion_props: null
    voiceover_asset_id: VO_ZH_007
    platforms: [rednote, douyin, bilibili]

# Two locales, SIBLING VARIANTS, not translations (agents.d/modules/localization.md). They tell the same
# story with the same beats, but they are separately authored and they differ where it
# matters: the DM rider's line is the FOUNDER role-playing in en-US and the RIDER'S OWN
# RECORDING in zh-CN, and the closing beat is 5.08s in en against 2.72s in zh.
# The thirteen beats sum to the 41.17s en-US master and the 44.51s zh-CN one, measured off
# VO_EN_025 / VO_ZH_007 at the auto-editor threshold and cut at the midpoint of each pause.
# Provisional until the subtitle pass.
#
# NOTE: "track owners get their spot" has now been absent for two takes running (it was in
# take 1 only). The same-map beat survives; the half of it that addressed track owners does
# not. Beat ids are stable across takes and name the beat, not the wording -- mad-simple now
# reads "It's a super simple map".
#
# meme-room is the one beat with no voiceover in it: 1.25s of held room tone that the edit
# fills with a card. It is a real beat, not slack, and the pacing only works if the picture
# does something there.
beats:
  - id: hook
    purpose: state the whole ambition in one line before anything is explained
    visual_intent: the map, moving; no UI chrome yet. The bed is silent here by design
    overlay: null
    target_duration_sec:
      en-US: 2.31
      zh-CN: 2.37
  - id: dm-ing-owners
    purpose: establish the grind the request interrupted
    visual_intent: over-the-shoulder of the DM thread; keep names off screen. The music
      enters on this beat's first word
    overlay: null
    target_duration_sec:
      en-US: 2.95
      zh-CN: 4.32
  - id: the-request
    purpose: hand the episode's premise to a user, not the founder
    visual_intent: the message itself, held long enough to read. In zh-CN this beat is the
      rider's own voice, so it can be treated as a cutaway rather than founder-to-camera
    overlay: null
    target_duration_sec:
      en-US: 2.78
      zh-CN: 2.46
  - id: say-less
    purpose: the turn — the request is accepted on the spot
    visual_intent: founder to camera; this is the one direct-address beat
    overlay: null
    target_duration_sec:
      en-US: 3.57
      zh-CN: 5.10
  - id: so-i-built-it
    purpose: compress the build into two seconds and get to the demo
    visual_intent: hard cut to the finished screen; resist a build montage
    overlay: null
    target_duration_sec:
      en-US: 2.22
      zh-CN: 2.75
  - id: mad-simple
    purpose: set the expectation the demo then has to meet
    visual_intent: title card or clean app frame; shortest beat in the cut
    overlay: null
    target_duration_sec:
      en-US: 1.30
      zh-CN: 1.01
  - id: private-by-default
    purpose: the trust claim, and the joke that carries it
    visual_intent: the upload flow through to the private badge; land on the badge
    overlay: null
    target_duration_sec:
      en-US: 3.87
      zh-CN: 4.54
  - id: meme-room
    purpose: hold the gatekeeping joke open for a meme card — no voiceover here
    visual_intent: meme insert, cut to the beat; 1.20s (en) / 1.22s (zh) is the whole beat
    overlay: null
    target_duration_sec:
      en-US: 1.20
      zh-CN: 1.22
  - id: send-the-link
    purpose: show that private does not mean alone
    visual_intent: share sheet, link out to a couple of contacts
    overlay: null
    target_duration_sec:
      en-US: 2.41
      zh-CN: 4.27
  - id: one-tap-public
    purpose: the product's real argument — the choice is reversible, both ways
    visual_intent: the toggle, twice, in real time; no speed-up. Longest beat with the cuts
    overlay: null
    target_duration_sec:
      en-US: 6.99
      zh-CN: 6.53
  - id: beautiful
    purpose: a breath, and the punctuation on the demo
    visual_intent: hold the public pin on the map
    overlay: null
    target_duration_sec:
      en-US: 0.65
      zh-CN: 0.58
  - id: same-map
    purpose: tie the feature back to the 100-track mission — one map, two kinds of pin
    visual_intent: pull out to the map with both trail lines and track pins on it
    overlay: null
    target_duration_sec:
      en-US: 5.84
      zh-CN: 6.64
  - id: dont-miss-out
    purpose: the ask, delivered as a plea rather than a CTA
    visual_intent: founder to camera again, closing the bracket opened at say-less
    overlay: null
    target_duration_sec:
      en-US: 5.08
      zh-CN: 2.72

assets:
  raw: []
  selected: []
  voiceover:
    - asset_id: VO_EN_025
      locale: en-US
      filename: S03E003.8_en-US_vo_v003.wav
      external_uri: null
      notes: >-
        Take 3 (one continuous read, 64.53s raw, mono) with dead air cut — house settings,
        same as S03E002 v004 onward. Nothing had to be stepped over: the loudest thing before
        the speech body is -48.4 dB. Fourth clean take in S03.
        Cut in two halves so a 1.00s ROOM-TONE INSERT can hold the pause after "we're
        gatekeeping all the way" open for a meme card. The tone is lifted from 28.60-29.60s of
        the raw take — inside the very pause it extends. In the master that pause is
        19.00-20.20s (1.20s) against a 0.225s median gap, and it is the only gap in the cut
        above 0.25s.
        NO TAIL PAD needed, unlike take 2: this read finishes 0.65s before the end of the
        recording, so auto-editor had the source to leave the margin itself (0.155s).
        THE SOURCE FILE CONTAINS 10 DIGITAL DROPOUTS of 72-91 ms (0.00, 0.12, 7.60, 8.09,
        11.70, 20.15, 20.74, 47.75, 52.49, 62.32s). Every one falls inside a pause, none
        inside a word, and all ten are removed by the cut — the master contains no run of
        near-zero samples longer than 1 ms. They look like packet-level silence insertion, so
        the file has probably been through a lossy transfer; worth chasing before a take
        lands one inside a word. The room-tone window was vetted against them.
        auto-editor also pads its own output up to a whole video frame with digital silence;
        vo-process.sh trims that off every piece before concatenating.
        34 speech runs, gaps median 0.225s / p90 0.245s / min 0.120s.
        No EQ, denoise, gate, compression, limiting, tempo or gain. Verified as a pure
        splice: gated octave-band spectrum against the raw take is +0.02 dB mean with
        0.12 dB tilt across 125 Hz-8 kHz, and 1044 gated frames became 1043.
        -28.9 LUFS / -7.2 dBFS / 41.17s — the shortest of the three takes by 2.4s.
        Reproduce with ./vo-process.sh; see edit-notes.md.
        SUPERSEDES v002 (take 2, VO_EN_024) and v001 (take 1, VO_EN_023). Both takes are still
        on disk as _vo-take2.m4a / _vo-take1.m4a; their masters are deleted.
    - asset_id: VO_ZH_007
      locale: zh-CN
      filename: S03E003.8_zh-CN_vo_v001.wav
      external_uri: null
      notes: >-
        Take 1 (one continuous read, 65.98s raw, mono) with dead air cut — house settings,
        same as S03E002 v004 onward. Nothing had to be stepped over: -44.6 dB before the
        speech body, -46.4 dB after it.
        TWO structural edits. (1) A GRAFT: the founder's own read of the DM rider's line
        (raw 9.95-12.52s) is replaced by the rider's recording, VOX_001 — the same move as
        the barber's reply on S03E003. (2) A 1.00s ROOM-TONE INSERT holding the pause after
        对，先藏着。谁也不给看。open for a meme card; in the master that pause is
        22.55-23.77s (1.22s) against a 0.225s median gap.
        THE TONE COULD NOT COME FROM THE PAUSE IT EXTENDS, unlike the en-US master: the zh
        take's own meme pause (35.49-37.19s) has three digital dropouts in it. 42.32-43.32s
        is the closest dropout-free second in the file — rms -55.0 dB against the pause's own
        -54.1, peak -44.1 against -44.5, and even across its whole length at 20 ms. In the
        master the inserted second reads -55.1 dB.
        THE SOURCE FILE CONTAINS 16 DIGITAL DROPOUTS of 5-100 ms (and the VOX_001 clip 2 more);
        every one falls inside a pause, none inside a word, and all are removed by the cut.
        The master contains no run of near-zero samples longer than 1 ms. Same signature as
        en-US take 3 — the whole batch has been through a lossy transfer.
        33 speech runs, gaps median 0.225s / p90 0.265s / min 0.165s. Apart from the meme
        pause the largest gap is 0.32s.
        No EQ, denoise, gate, compression, limiting or tempo. Verified as a pure splice over
        the take-derived material (master 9.25-44.50 against raw 14.20-65.96): +0.04 dB mean,
        0.13 dB tilt across 125 Hz-8 kHz. Measured against the WHOLE take the tilt is 0.73 dB
        with +0.63 at 8 kHz — that is the grafted rider's voice, a different speaker, not
        processing.
        -31.3 LUFS / -10.4 dBFS / 44.51s. Reproduce with ./vo-process.sh; see edit-notes.md.
  audio:
    - asset_id: VOX_001
      filename: S03E003.8_zh-CN_dm-rider.m4a # lives in media/S04E002/voiceover/
      external_uri: null
      source: supplied by the operator — the DM rider's own recording, zh-CN only
      license: >-
        NOT ON FILE. A second, identifiable person's voice. E003 raises the same question for
        the barber; this is a separate one and should be asked separately.
      notes: >-
        4.03s file, one clean speech run at 0.71-2.99s, mono, -29.7 LUFS / -13.3 dBFS.
        Reads 要是我自己的路线也分享上去就好了 — the same request as the script's
        要是我自己的路线也能直接分享到这上面就好了, in the rider's own tighter phrasing.
        Grafted at 6.79-9.05s of the master, joins measuring 0.21s and 0.20s against a 0.225s
        median gap, so the splice is invisible in the pacing. Both joins were profiled at
        5 ms: continuous decay into room tone, no level step and no click.
        MATCH GAIN -1.76 dB, applied before the cut so auto-editor sees the level it will be
        heard at. This is the documented exception to the no-gain rule (AGENTS.md): joining
        two takes. Reference is the WHOLE take (-28.48 dB speech-gated RMS), not a
        neighbouring region — the take drifts 1.9 dB across itself (-29.89 / -28.00 / -28.23),
        so a neighbour reference would make the graft's level depend on where a region
        boundary happens to fall.
        There is no en-US counterpart: in en-US the founder role-plays this line himself.
    - asset_id: MUS_001
      filename: riders-on-the-storm-instrumental.mp3 # lives in media/audio/
      external_uri: null
      source: operator-supplied instrumental
      license: >-
        NOT CLEARED — commercial recording, no licence on file for social commercial use.
        Placeholder for the review mix only; must be replaced or licensed before publish.
        THE FIRST BED IN media/audio/ THAT IS NOT A CLIPPED MASTER: peaks -3.2 dBFS, against
        +0.9 (show-me), +0.4 (magnolia) and +2.4 dBFS (freek-a-leek). Attenuated 21.9 dB in
        the review mix.
        372.30s, -17.1 LUFS, and by a wide margin the most level track in the library: 5s
        RMS sits between -18.3 and -19.7 dB from 5s to 340s, a 3.5 dB spread across nearly
        six minutes, with no breakdowns. Starts at 5s, which is the first fully-level bar
        (block 0 is the -26.3 dB intro fade) and gives a 0.8 dB spread across the 44s used.
        285s measures 0.3 dB flatter, which is below audibility — 5s is preferred because it
        opens the bed on the track's own opening rather than mid-piece.
