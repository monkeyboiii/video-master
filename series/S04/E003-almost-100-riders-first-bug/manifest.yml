# Episode manifest — source of truth for this episode.
# Schema notes and naming: agents.d/modules/naming-conventions.md
# Validate with: tools/vm check

# Was an interstitial with a one-decimal id (see brief.md for how it was produced).
# The decimal form is retired: it said WHERE a piece published and never said what it
# was, so these moved into seasons of their own and `lineage:` below carries both
# facts separately. It still does not advance the 100-track counter.
video_id: "S04E003"
slug: "almost-100-riders-first-bug"
# The VO is recorded and cut and the script + beats below are TRANSCRIBED off it, but no
# script was supplied and the packaging pass (cover) hasn't run. The stage gates are ordered,
# so this stays at topic rather than claiming scripting. Moving it up needs a cover and one
# listen against the four uncertain lines in each script, not more audio.
status: topic

lineage:
  follows: S03E004
  reason: >-
    product update; published between S03E004 and what came next

formats:
  primary: short_vertical
  aspect: 9x16
  resolution: 1080x1920
  fps: 30

variants:
  en-US:
    script: script.en-US.md
    cover: null
    subtitles: subtitles/en-US.srt
    remotion_props: null
    voiceover_asset_id: VO_EN_026
    platforms: [tiktok, ytshorts, reels]
  zh-CN:
    script: script.zh-CN.md
    cover: null
    subtitles: subtitles/zh-CN.srt
    remotion_props: null
    voiceover_asset_id: VO_ZH_010
    platforms: [rednote, douyin, bilibili]

# Two locales, SIBLING VARIANTS, not translations (agents.d/modules/localization.md). Same eleven beats
# in the same order, but they were read separately and they split differently: en-US uses 15
# sentences to zh-CN's 12. and-also-sorry is two lines in en-US and one in zh-CN, met-a-rider
# is two and one, bug-number-one is three and one, and stay-tuned is one and two. The en-US
# read is 1.20s longer overall.
#
# The eleven beats sum to the 27.23s en-US master and the 26.03s zh-CN one. They are NOT
# guesses: each beat boundary is a real splice join in the master, recovered by aligning the
# cut back against its own take, so the durations are exact to the sample and then rounded to
# 2dp. Provisional only in the sense that the subtitle pass may want to split the two longest
# beats.
beats:
  - id: hook
    purpose: put the milestone up front, as a number, before anything is asked for
    visual_intent: the map or the roster filling in; no founder yet. The bed is silent here
      by design — this beat plays completely dry
    overlay: null
    target_duration_sec:
      en-US: 2.09
      zh-CN: 1.95
  - id: thank-you
    purpose: turn the milestone into a reason to give something away
    visual_intent: founder to camera. The music enters on this beat's first word — cut here
      if the picture cuts with the bed
    overlay: null
    target_duration_sec:
      en-US: 1.16
      zh-CN: 1.07
  - id: the-giveaway
    purpose: the only ask in the episode — state the terms once, clearly
    visual_intent: the airtime card itself on screen with the count; assume the viewer has
      never seen one
    overlay: null
    target_duration_sec:
      en-US: 2.64
      zh-CN: 2.37
  - id: and-also-sorry
    purpose: the pivot — an apology before the viewer knows what for
    visual_intent: en-US holds a beat between "And also..." and "Sorry." (0.17s) and the
      pause is the joke; zh-CN reads it as one line and should not be split in the edit
    overlay: null
    target_duration_sec:
      en-US: 1.64
      zh-CN: 1.47
  - id: met-a-rider
    purpose: hand the episode's premise to a user, not the founder
    visual_intent: the track, then the phone. Longest beat in the first half of the en-US cut
    overlay: null
    target_duration_sec:
      en-US: 5.10
      zh-CN: 3.37
  - id: he-opened-it
    purpose: the setup frame — hold before the payoff
    visual_intent: the app opening on someone else's phone. Shortest beat in the en-US cut
      at 0.70s; do not decorate it
    overlay: null
    target_duration_sec:
      en-US: 0.70
      zh-CN: 1.43
  - id: wrong-language
    purpose: the bug, in the rider's own words rather than the founder's
    visual_intent: quoted speech on screen; the wrong-language state visible behind it
    overlay: null
    target_duration_sec:
      en-US: 2.47
      zh-CN: 1.83
  - id: bug-number-one
    purpose: own it on camera, immediately, with no hedge
    visual_intent: founder to camera. en-US builds it over three lines 0.14s apart — one
      card that builds, not three cuts
    overlay: null
    target_duration_sec:
      en-US: 2.36
      zh-CN: 1.93
  - id: the-workaround
    purpose: the only instruction in the episode — the fix the viewer can do now
    visual_intent: real screen recording. Profile settings, the yellow triangle, the tap.
      Longest beat in both cuts; reading it out is not enough
    overlay: null
    target_duration_sec:
      en-US: 4.74
      zh-CN: 4.31
  - id: build-it-together
    purpose: close the bracket the hook opened — the count is the community
    visual_intent: back to the map or the roster from the hook
    overlay: null
    target_duration_sec:
      en-US: 2.26
      zh-CN: 2.56
  - id: stay-tuned
    purpose: hold the door open for the next episode
    visual_intent: en-US closes on one line, zh-CN on two (3.74s, with a 0.22s pause) — the
      last cards are not interchangeable between the locales
    overlay: null
    target_duration_sec:
      en-US: 2.08
      zh-CN: 3.74

