        Take 1 (one continuous read, 46.78s raw, mono, -31.1 LUFS / -11.3 dBTP) with dead air
        cut — house settings, unchanged since S03E002 v004. A PLAIN SILENCE CUT: one region,
        no inserts, no grafts, nothing stepped over. Region 0.30-45.90s of the take; 0.30
        clears the encoder lead-in (junk to 0.192s) and 45.90 sits 0.27s past the last word,
        leaving room for the 0.12s tail margin.
        15 spliced regions, one per script sentence, recovered by aligning the master back
        against its own take. 46.78s -> 27.23s: 41.8% of the recording was dead air.
        13 audible speech blocks, pauses median 0.189s / min 0.134s / max 0.234s.
        THE SOURCE FILE CONTAINS 7 DIGITAL DROPOUTS of 5-44 ms (0.00, 0.136, 0.149, 5.98,
        33.81, 33.83, 43.45s) — the same lossy-transfer signature as every take since
        S03E003.8, and the count is finally down: 10 -> 16 -> 19 -> 7. All seven fall in room
        tone at -46 to -93 dB, none inside a word, none inside a retained margin (the closest
        clears by 0.23s), and all seven are removed by the cut. The master contains no run of
        zero samples at all.
        No EQ, denoise, gate, compression, limiting or tempo. VERIFIED AS A PURE SPLICE by
        residual: every one of the 15 regions aligns to an integer sample offset in the take
        with a residual of -81 to -95 dB, 52-65 dB under signal, and the residual does not
        track signal level. The per-region least-squares gain against the take is 9.7000 dB
        with a spread of 0.0001 dB across all 15 — one constant scalar, which is exactly what
        the delivery stage claims to be.
        DELIVERY GAIN +9.70 dB, the only gain in the chain (S03E004 introduced this). Derived,
        not chosen: DELIVERY_TP(-1.0) minus the higher of the voice and mix true peaks. The
        review mix peaked higher here, so the voice master lands at -1.6 dBTP.
        -21.2 LUFS / -1.6 dBTP / 27.23s. Reproduce with ./vo-process.sh; see edit-notes.md.
