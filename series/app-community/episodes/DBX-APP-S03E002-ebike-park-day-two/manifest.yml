# S03 runs as a numbered field mission: one real track per episode, counted toward 100.
# The nine beats sum to the 50.14s English master. On the Chinese-hook cut the hook beat is
# 4.29s instead of 4.79s, so every later cue sits 0.50s earlier — see edit-notes.md.
# Boundaries are measured off VO_EN_014 but stay provisional until the subtitle pass.
beats:
  - id: hook
    purpose: carry the E001 counter forward and make day two personal in one line
    visual_intent: arrival wide on the hometown park; the 100-track counter carries over from E001
    overlay: null
    target_duration_sec:
      en-US: 4.79
  - id: hometown-knowledge
    purpose: establish authority so the e-bike reversal has something to land against
    visual_intent: mountain/trail wides; old downhill lines pointed out on camera
    overlay: null
    target_duration_sec:
      en-US: 5.04
  - id: all-electric
    purpose: the reversal — the place changed while he was away
    visual_intent: rack of e-bikes, battery close-ups, deadpan to camera on "Fantastic"
    overlay: null
    target_duration_sec:
      en-US: 6.79
  - id: why-it-matters
    purpose: the positioning line — the app follows what riders actually ride
    visual_intent: riders on e-bikes mid-session; no phone on screen yet
    overlay: null
    target_duration_sec:
      en-US: 5.48
  - id: same-dirt
    purpose: argue that this still counts as a dirt bike track
    visual_intent: one cutaway per noun — dirt, jumps, berms — then riders
    overlay: null
    target_duration_sec:
      en-US: 5.99
  - id: no-more-pushing
    purpose: the relatable pain, told against himself
    visual_intent: e-bike climbing effortlessly, intercut with the stairs he used to push up
    overlay: null
    target_duration_sec:
      en-US: 5.78
  - id: find-the-boss
    purpose: the confident setup the record scratch knocks over
    visual_intent: handheld approach to the boss, over-the-shoulder on the app; hard stop on the scratch
    overlay: null
    target_duration_sec:
      en-US: 5.30
  - id: not-quite
    purpose: the rejection, played straight — and the advice that came with it
    visual_intent: founder to camera, no cutaway to hide behind; GPX / live tracking called out on screen
    overlay: null
    target_duration_sec:
      en-US: 7.86
  - id: learning
    purpose: pay off the count without pretending the deal happened
    visual_intent: E-BIKE PARK 2 / 100 counter card over a wide of the park
    overlay: null
    target_duration_sec:
      en-US: 3.11

