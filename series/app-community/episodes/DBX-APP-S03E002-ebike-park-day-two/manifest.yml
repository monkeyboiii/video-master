# Beat durations are provisional: they sum to the 44.23s VO master, but the real
# boundaries get locked at the subtitle pass against VO_EN_004.
beats:
  - id: hook
    purpose: carry the E001 counter forward and make day two personal in one line
    visual_intent: arrival wide on the hometown park; the 100-track counter carries over from E001
    overlay: null
    target_duration_sec:
      en-US: 4.52
  - id: hometown-knowledge
    purpose: establish authority so the e-bike reversal has something to land against
    visual_intent: mountain/trail wides; old downhill lines pointed out on camera
    overlay: null
    target_duration_sec:
      en-US: 5.45
  - id: all-electric
    purpose: the reversal — the place changed while he was away
    visual_intent: rack of e-bikes, battery close-ups, deadpan to camera on "Fantastic"
    overlay: null
    target_duration_sec:
      en-US: 6.77
  - id: why-it-matters
    purpose: the positioning line — the app follows what riders actually ride
    visual_intent: riders on e-bikes mid-session; no phone on screen yet
    overlay: null
    target_duration_sec:
      en-US: 6.39
  - id: same-dirt
    purpose: argue that this still counts as a dirt bike track
    visual_intent: one cutaway per noun — dirt, jumps, berms — then riders
    overlay: null
    target_duration_sec:
      en-US: 5.08
  - id: no-more-pushing
    purpose: the relatable pain, told against himself
    visual_intent: e-bike climbing effortlessly, intercut with the stairs he used to push up
    overlay: null
    target_duration_sec:
      en-US: 6.02
  - id: seal-the-deal
    purpose: the series mechanic — owner conversation and the track badge
    visual_intent: handheld approach to the owner, over-the-shoulder on the app, badge on the track page
    overlay: null
    target_duration_sec:
      en-US: 6.96
  - id: track-two-secured
    purpose: pay off the count
    visual_intent: E-BIKE PARK 2 / 100 counter card over a wide of the park
    overlay: null
    target_duration_sec:
      en-US: 3.04
  - id: punchline
    purpose: deflate the mission; the send-to-a-friend beat
    visual_intent: girlfriend off-hand on location; hard cut out on the reply
    overlay: null
    target_duration_sec:
      en-US: 4.0

