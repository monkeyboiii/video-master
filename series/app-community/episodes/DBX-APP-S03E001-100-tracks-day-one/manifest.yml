# S03 runs as a numbered field mission: one real track per episode, counted toward 100.
# The app appears as a step inside the mission, never as a pitch.
# The nine VO beats sum to the 37.05s master; `punchline` is on-location dialogue on top.
# Boundaries are provisional until the subtitle pass locks them against VO_EN_003.
beats:
  - id: hook
    purpose: scroll-stop on the absurd number and open the 100-track loop
    visual_intent: founder to camera in the open, bikes or track visible behind; the number lands as an on-screen pop
    overlay: null
    target_duration_sec:
      en-US: 3.41
  - id: build-app
    purpose: establish the software-guy identity as a throwaway, not a brag
    visual_intent: screen-recording or laptop insert cut hard against the outdoor shot; deliberately too fast to be believable
    overlay: null
    target_duration_sec:
      en-US: 5.04
  - id: drive-to-track
    purpose: set the running girlfriend dynamic that pays off in the punchline
    visual_intent: car POV or passenger-seat shot, then arrival wide on real riders
    overlay: null
    target_duration_sec:
      en-US: 5.97
  - id: find-owner
    purpose: the real mechanic of the series — permission from the track owner
    visual_intent: handheld approach to the owner; keep it documentary, no staged framing
    overlay: null
    target_duration_sec:
      en-US: 5.11
  - id: show-the-app
    purpose: the single product moment, one line long
    visual_intent: over-the-shoulder on the phone showing the track page
    overlay: null
    target_duration_sec:
      en-US: 1.7
  - id: rider-to-rider
    purpose: comedy escalation that also shows real riders being onboarded
    visual_intent: four quick hard cuts, one per escalation (bow / beg / tear up / trauma)
    overlay: null
    target_duration_sec:
      en-US: 5.7
  - id: whatever-it-takes
    purpose: land the escalation and reset the pace before the mascot beat
    visual_intent: riders on phones signing up; quick montage of real faces
    overlay: null
    target_duration_sec:
      en-US: 2.98
  - id: track-dog
    purpose: pattern interrupt right before the payoff; the most shareable second
    visual_intent: low-angle close on the track dog; hold longer than feels right
    overlay: null
    target_duration_sec:
      en-US: 4.69
  - id: mission-accomplished
    purpose: pay off the loop and make the count feel real
    visual_intent: wide of the track, TRACK 1 / 100 counter card
    overlay: null
    target_duration_sec:
      en-US: 2.45
  - id: punchline
    purpose: deflate the whole mission; the reason the video gets sent to a friend
    visual_intent: girlfriend delivers the line off-hand; hard cut to black mid-word
    overlay: null
    target_duration_sec:
      en-US: 4.5

