# S03 runs as a numbered field mission: one real track per episode, counted toward 100.
# The app appears as a step inside the mission, never as a pitch.
# The nine VO beats sum to the 37.05s master; `punchline` is on-location dialogue on top.
# Boundaries are provisional until the subtitle pass locks them against VO_EN_003.
beats:
  - id: hook
    purpose: scroll-stop on the absurd number and open the 100-track loop
    visual_intent: founder to camera in the open; the number lands as an on-screen pop
    overlay: null
    target_duration_sec:
      en-US: 3.87
  - id: first-step
    purpose: establish the software-guy identity as a throwaway, not a brag
    visual_intent: screen-recording or laptop insert cut hard against the outdoor shot; deliberately too fast to be believable
    overlay: null
    target_duration_sec:
      en-US: 4.85
  - id: second-step
    purpose: set up the reveal, and the running girlfriend dynamic
    visual_intent: car POV or passenger-seat shot heading out
    overlay: null
    target_duration_sec:
      en-US: 3.75
  - id: the-reveal
    purpose: name the real track; the drumroll is the joke
    visual_intent: drumroll over a held frame, then a 湖州 / HUZHOU card and the arrival wide
    overlay: null
    target_duration_sec:
      en-US: 5.15
  - id: the-guy
    purpose: the episode's actual find — the rider who grew up on this track
    visual_intent: riders pointing him onward, then the guy; kid standing behind the grown-up on "(literally)"
    overlay: null
    target_duration_sec:
      en-US: 12.19
  - id: more-than-dirt
    purpose: the series thesis, said in passing rather than declared
    visual_intent: wides of the track working — jumps, berms, people talking between runs
    overlay: null
    target_duration_sec:
      en-US: 9.69
  - id: track-dog
    purpose: pattern interrupt right before the payoff; the most shareable second
    visual_intent: low-angle close on the track dog; hold longer than feels right
    overlay: null
    target_duration_sec:
      en-US: 5.15
  - id: track-one-down
    purpose: pay off the count and make it feel real
    visual_intent: wide of the track, +1 — 1 / 100 counter card
    overlay: null
    target_duration_sec:
      en-US: 2.21
assets:
  raw: []
  selected: []
  voiceover:
    - asset_id: VO_EN_008
      locale: en-US
      filename: DBX-APP-S03E001_en-US_vo_v006.wav
      external_uri: null
      notes: >-
        Takes 1 + 4 + snippet. Hook and first-step from take 1 (take 4's wording),
        gain-matched +5.00 dB. Body from take 4. "Um hum. That's what I'm talking about!"
        from the snippet take, used AT ITS OWN LEVEL (~3 dB under the surrounding delivery)
        because the take-4 read was too loud there. Lines join at 0.30s, sub-phrases at
        0.12s; "the track dog!" is its own line so a beat lands before the reveal.
        Drumroll is the spoken line only. No EQ, denoise, gate, compression, limiting or
        tempo. -26.2 LUFS / -6.3 dBFS / 46.86s.
        Reproduce with ./vo-process.sh; line table in edit-notes.md (## VO audio).
    - asset_id: VO_EN_009
      locale: en-US
      filename: DBX-APP-S03E001_en-US_vo-cnhook_v006.wav
      external_uri: null
      notes: >-
        Same cut with the recorded Chinese hook replacing the English one — for the
        Chinese-language platforms. -26.3 LUFS / -6.3 dBFS / 47.88s.
