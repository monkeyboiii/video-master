      external_uri: null
      notes: >-
        Take 1, splice only, no word-level tweaks. Kept for A/B; superseded by VO_EN_003.
    - asset_id: VO_EN_003
      locale: en-US
      filename: DBX-APP-S03E001_en-US_vo_v003.wav
      external_uri: null
      notes: >-
        Take 1, splice + four word-level tweaks: a 0.35s beat before "Boom", +0.15s between
        each of bow / beg / tear up, "pull out the whole childhood trauma" at 1.08x with its
        level matched back to source, and a 0.30s beat before the closing "That's it".
        No EQ, denoise, gate, compression, limiting or overall gain — level is the take's own
        (-31.2 LUFS / -8.9 dBFS peak / 37.05s). Reproduce with ./vo-process.sh; the tweak
        offsets live in its EDITS list and are guarded against the splice length.
        Punchline is not in this master.
