# Episode manifest — source of truth for this episode.
# Naming: agents.d/modules/naming-conventions.md · validate: tools/vm check

video_id: "S05E002"
slug: "mxgp-shanghai-this-weekend"
# Nothing is shot and nothing is recorded. The script and the beats exist, the caption
# preview is synthesised, and the durations below are ESTIMATES rather than measurements —
# so this stays at topic. Moving it up needs a real take, which re-times every beat.
status: topic

# No lineage block. `parent`/`follows` point at a single EPISODE, and this one answers no
# single episode — it spins off the whole S03 run, which is a fact about the season and is
# recorded in series/S05/README.md. The connection is also in the script: the closing beat
# says the 100-track challenge is still going.

formats:
  primary: short_vertical
  aspect: 9x16
  resolution: 1080x1920
  fps: 30

variants:
  zh-CN:
    script: script.zh-CN.md
    cover: null
    subtitles: null
    captions: remotion-props/spoken-captions.zh-CN.json
    remotion_props: null
    # No human take yet. The caption preview comes from Kokoro via /auto-narrate; the rows
    # in the captions file above are timed off THAT voice, not off a recording.
    voiceover_asset_id: null
    platforms: [rednote, douyin, bilibili]

# zh-CN only. Per agents.d/modules/localization.md an en-US edition would be authored
# natively rather than translated, so no en-US variant is declared.
#
# TIMING SOURCE: SYNTHESISED, not a take. These numbers were first estimated from character
# count and every one was wrong — eleven of twelve beats came back OVER on the first
# /auto-narrate run. They are now the duration Kokoro actually took at speed 1.15 plus 0.05s,
# which is a real measurement of the voice that plays in the PREVIEW and still not a measurement
# of a human read.
#
# THE GAP WAS NEVER THE BEAT LENGTH. Two passes shortened the beats — 0.30s of air, then 0.05s —
# and the piece still read as sentences with pauses, because `silencedetect` at -45 dB showed the
# real gaps between spoken words were 1.31-1.45s the whole time. Kokoro pads every clip with about
# 0.37s of lead and 1.0s of tail, and `spoke` was that padded length, so a beat sized to it was
# mostly silence no matter how tight the number looked.
#
# build-narration.py now trims that padding (`trim_silence`, and `--keep-padding` to opt out), so
# these are SPEECH lengths plus 0.08s. hook went 2.48s -> 1.19s of actual voice. Total 24.60s,
# down from 38.50s, with nothing said any faster and no word clipped.
#
# `chinese-can-fly` carries no synthesised voice, so its length is set by hand: the jump held
# under one spoken line lifted from the source clip.
#
# A recorded take re-times all of them. agents.d/modules/captions.md
# § Timing comes from measurement, not from feel is explicit that this is the weaker kind of
# number; it is declared here so nothing downstream mistakes it for a measurement. The
# /auto-narrate run prints spoke-vs-cap per beat and any beat marked OVER is a line to
# shorten, which is how these get corrected before a take.
beats:
  - id: hook
    purpose: an accusation, not a greeting — the viewer is already behind
    # 1.95s for 1.19s of speech, and the 0.76s of air is doing a job. The music has to be低 under
    # this line — it was burying it — and it cannot swell while the line is still being spoken.
    # So the swell happens AFTER the hook finishes and reaches normal about 0.25s before
    # 中国人能飞. The gap here is a music cue, not slack: tightening it puts the bed back on top
    # of the voice.
    visual_intent: straight to camera, no establishing shot
    overlay: null
    target_duration_sec:
      zh-CN: 1.95
  - id: chinese-can-fly
    purpose: land the line in a real voice, not the narrator's — and carry the jump under it
    # The silent `the-jump` beat is GONE. It was the only thing between the first two lines, so
    # its length WAS the gap, and at 0.40s the two still did not read as one thought. The jump
    # picture now plays under this beat instead of owning one: the hook ends and the music cuts
    # straight in. Gap from the hook's last word to 中 is 0.22s.
    visual_intent: the jump, held, with the source line over it
    overlay: null
    target_duration_sec:
      zh-CN: 1.75
  - id: flying-broll
    purpose: give the flying its own time — the claim in the next line has to be earned first
    # The song sings 中国人能飞 THREE times, on a clap grid measured at 1.75s. chinese-can-fly is
    # the first; this beat is the second and third, at the source's own volume, with no narration
    # over it. The third script line is pushed back by exactly this much so the b-roll has frames.
    visual_intent: dirt bike airborne, end to end — the longest held pictures in the piece
    overlay: null
    target_duration_sec:
      zh-CN: 3.50
  - id: not-vfx
    purpose: name the thing, and borrow a frame the audience already has (F1)
    visual_intent: MXGP title card over the widest track shot available
    overlay: null
    target_duration_sec:
      zh-CN: 2.53
  - id: this-weekend
    purpose: the turn from spectacle to appointment
    visual_intent: cut rhythm tightens here; short beat, short shot
    overlay: null
    target_duration_sec:
      zh-CN: 0.89
  - id: in-shanghai
    purpose: the payoff of the previous beat, alone on screen
    visual_intent: Shanghai plate or skyline, one beat only
    overlay: null
    target_duration_sec:
      zh-CN: 0.96
  - id: only-on-tv
    purpose: the narrator admits the audience's own assumption before correcting it
    visual_intent: archive-feeling footage, foreign broadcast look
    overlay: null
    target_duration_sec:
      zh-CN: 3.37
  - id: now-here
    purpose: the correction
    visual_intent: riders arriving, paddock, faces
    overlay: null
    target_duration_sec:
      zh-CN: 2.83
  - id: or-the-mall
    purpose: the needle — the alternative weekend, named
    visual_intent: hard cut to something mundane, then back
    overlay: null
    target_duration_sec:
      zh-CN: 2.72
  - id: no-need-to-know
    purpose: remove the last excuse
    visual_intent: to camera again, plain
    overlay: null
    target_duration_sec:
      zh-CN: 1.21
  - id: just-watch-them-fly
    purpose: restate the promise as an instruction
    visual_intent: the biggest air in the footage; 希望别摔 bubble on the landing
    overlay: null
    target_duration_sec:
      zh-CN: 1.59
  - id: hundred-tracks
    purpose: tie the piece back to the season it spins off from
    visual_intent: the narrator's own bike, or a previous track from S03
    overlay: null
    target_duration_sec:
      zh-CN: 3.37
  - id: see-you-in-shanghai
    purpose: the sign-off doubles as the next episode's hook
    visual_intent: ride out of frame
    overlay: null
    target_duration_sec:
      zh-CN: 1.46

assets:
  raw: []
  selected: []
  voiceover: []
  audio:
    - asset_id: VOX_002
      filename: The Chinese Can Fly.mp3 # lives in media/audio/
      external_uri: null
      source: operator-supplied source clip, "The Chinese Can Fly"
      license: >-
        NOT CLEARED — third-party recording, no licence on file. Placeholder for the preview
        only; must be cleared or replaced before publish.
        ONE CONTINUOUS USE, not two. The source is entered at 00:00:43 for the
        speaker's own line 中国人能飞, which lands on the `chinese-can-fly` beat, and it is then
        NOT cut — the same take runs on underneath as the bed for the rest of the piece. That is
        why the beat carries `**原声:**` instead of `**口播:**`: nothing is synthesised for it.
        In the preview mix the line sits at -10 dB and ducks over 0.3s to -26 dB for the bed.
        MEASURED 2026-09-08 on the dev box, at 320 kbps 44.1 kHz stereo: 117.45s,
        integrated -6.4 LUFS, true peak +3.8 dBFS, LRA 13.9 LU. It is a CLIPPED master and the
        hottest source in this repo — every bed in S05E001 peaked lower (+0.9, +0.4, +2.4) and
        those were attenuated 28.8-32.4 dB to sit under a voice. Do not use it at unity anywhere,
        and expect a similar attenuation for the bed.
        THE PHRASE CANNOT BE CUT ON SILENCE. Level is flat at about -6 dB mean across 40-47s and
        `silencedetect` at -32 dB / 0.15s finds no gap anywhere in that window — it is a
        continuous music bed with the line over it. So the in/out points have to be set by ear or
        by transcription, not by a threshold.
        UNVERIFIED — the 43-44s window is the operator's, and nothing on this box has confirmed
        the phrase boundaries. `tools/transcribe.mjs` is the documented loop for a human take but
        only whisper.cpp's dummy test models (575 KB) are present; a real model is a ~3 GB
        download that nobody has asked for.
